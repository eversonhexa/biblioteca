<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo — Biblioteca Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="cabecalho__conteudo">
      <a href="index.html" class="cabecalho__logo">📚 Biblioteca Escolar</a>

      <nav class="menu">
        <ul class="menu__lista">
          <li><a href="index.html" class="menu__link">Início</a></li>
          <li><a href="acervo.html" class="menu__link menu__link--ativo">Acervo</a></li>
          <li><a href="emprestimos.html" class="menu__link">Empréstimos</a></li>
          <li><a href="cadastro.html" class="menu__link">Cadastrar Livro</a></li>
          <li><a href="login.html" class="menu__link">Entrar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="conteudo">
    <section class="acervo">
      <h1>Acervo</h1>
      <p>Consulte os livros cadastrados na biblioteca.</p>

      <div class="acervo__busca">
        <label for="campo-busca">Buscar por título ou autor:</label>
        <input
          type="search"
          id="campo-busca"
          placeholder="Ex.: Machado de Assis"
          autocomplete="off"
        >
      </div>

      <table class="tabela">
        <thead>
          <tr>
            <th scope="col">Título</th>
            <th scope="col">Autor</th>
            <th scope="col">Categoria</th>
            <th scope="col">Ano</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <!-- As linhas <tr> aqui dentro são geradas pelo JavaScript,
             a partir da lista de livros em js/dados-acervo.js -->
        <tbody id="tabela-acervo-corpo"></tbody>
      </table>

      <p id="mensagem-vazio" class="mensagem-vazio" hidden>
        Nenhum livro encontrado com esse termo de busca.
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p>&copy; <span id="ano-atual">2026</span> Biblioteca Escolar — projeto didático.</p>
  </footer>

  <script src="js/dados-acervo.js"></script>
  <script src="js/acervo.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
